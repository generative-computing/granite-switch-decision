name: Image

# Builds the Docker image and pushes it to GitHub Container Registry. Runs on a
# version tag, or by hand against any ref (leave "push" off to build without publishing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    # Two images per release: the default (decisions only, no speech model inside) and an
    # `-asr` variant with the pinned speech model baked in, for chat speech input.
    name: image (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `latest` stays the default image; the asr image gets `latest-asr` (onlatest=true),
          # so the two variants never push the same tag.
          - variant: default
            with_asr: "0"
            flavor: "latest=auto"
          - variant: asr
            with_asr: "1"
            flavor: "suffix=-asr,onlatest=true"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      # The base image is large; the runner's default free disk is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: WITH_ASR=${{ matrix.with_asr }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
