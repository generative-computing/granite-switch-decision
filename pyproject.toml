[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch-decision"
version = "0.2.0"
description = "jev system-one (/v1/systemone) and OpenAI Decisions (/v1/decisions) APIs as vLLM endpoint plugins for granite-switch, mounted alongside /v1/chat/completions on the same server."
readme = "README.md"
# SPDX license expressions and license-files need setuptools 77.
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# granite-switch 0.1.1 requires Python 3.11-3.13.
requires-python = ">=3.11"
# fastapi, pydantic and starlette are already vLLM runtime dependencies, so they are not
# declared here. That avoids a resolver conflict with the versions the vLLM image pins.
dependencies = []

[project.optional-dependencies]
# fastapi/pydantic are vllm's own runtime dependencies; declared here only for
# running this package's own tests/lint outside a vLLM container (e.g. in CI).
# httpx backs fastapi's TestClient for the route-level tests in test_decisions.py;
# jsonschema validates both routes against published schemas (tests/specs.py); typesafe-sdk
# (MIT) supplies jev's wire models for the /v1/systemone schema test.
dev = ["fastapi", "pydantic", "pytest", "ruff==0.17.1", "ty==0.0.90", "httpx", "jsonschema", "typesafe-sdk==0.7.5"]

[project.entry-points."vllm.endpoint_plugins"]
granite_switch_decision = "granite_switch_decision.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["granite_switch_decision"]

[tool.ty.rules]
# vLLM is the runtime dependency that matters most and the one we can never install
# in a check environment (CUDA-bound); everything else we import is in the dev extra.
unresolved-import = "ignore"
