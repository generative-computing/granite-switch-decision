fail_fast: true
# Hooks run at pre-commit unless they set stages (the DCO check runs at commit-msg).
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
        args: [--config=pyproject.toml]
      - id: ruff
        args: [--exit-non-zero-on-fix, --fix, --config=pyproject.toml]

  - repo: local
    hooks:
      - id: check-headers
        name: Check SPDX headers
        entry: python3 ci/check_headers.py
        language: system
        files: ^(src|tests|scripts)/.*\.py$

      - id: dco-check
        name: DCO sign-off check
        entry: "bash -c 'git rev-parse -q --verify MERGE_HEAD >/dev/null && exit 0; grep -q \"^Signed-off-by: \" \"$1\" || { echo \"Missing Signed-off-by trailer. Use: git commit -s\"; exit 1; }' --"
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
